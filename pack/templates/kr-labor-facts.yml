# korea-career-pack — Korean labor facts (verified, cited, local data table)
#
# Read by modes/ko/offer-prep.md and modes/ko/offer-compare.md as a LOCAL file
# lookup. It follows career-ops' templates/restrictive-covenants.yml discipline:
#   1. every row has a citable source,
#   2. an effective date (or "case law" when it is a court ruling), and
#   3. an `as_of` date recording when the row was last verified.
# Rows describe what the law/guideline SAYS. They are never a basis for saying
# a specific clause is valid, void, or illegal — that is always a question for
# a 노무사(labor attorney) or 변호사.
#
# Pending legislation is recorded as `status: pending` and MUST NOT be described
# as law. Re-verify every row before relying on it; laws change.

facts:

  - id: written_terms
    topic: 근로조건 명시·서면 교부
    statement: >
      사용자는 근로계약 체결·변경 시 임금, 소정근로시간, 휴일(제55조), 연차유급휴가(제60조),
      그 밖에 대통령령으로 정하는 근로조건을 명시해야 한다. 이 중 임금의 구성항목·계산방법·지급방법,
      소정근로시간, 휴일, 연차유급휴가는 서면(전자문서 포함)으로 교부해야 한다.
    use_in_offer_prep: >
      오퍼레터·처우협의서에 이 항목이 빠져 있으면 '근로계약서에서 확인할 항목'으로 적는다.
      빠졌다는 사실만 기록하고, 위법 여부는 판단하지 않는다.
    legal_basis: 근로기준법 제17조
    status: in_force
    sources:
      - https://korea.legal/wiki/근로기준법-제17조/
    as_of: "2026-10-23"

  - id: severance
    topic: 퇴직금
    statement: >
      계속근로기간 1년에 대하여 30일분 이상의 평균임금을 퇴직금으로 지급한다.
      계속근로기간 1년 미만, 4주간 평균 1주 소정근로시간 15시간 미만 근로자는 제외된다.
      평균임금은 산정사유 발생일 이전 3개월 임금 총액을 그 기간 총일수로 나눈 금액이다.
    use_in_offer_prep: >
      '퇴직금 포함 연봉'이라는 표현이 있으면 매월 지급액과 퇴직 시 지급액이 어떻게 나뉘는지
      서면으로 확인할 질문을 만든다. 적법성 판단은 노무사 질문 목록으로 보낸다.
    legal_basis: 근로자퇴직급여 보장법 제4조, 제8조
    status: in_force
    sources:
      - https://shiftee.io/ko/blog/article/requirements-for-receiving-severance-pay
    as_of: "2026-10-23"

  - id: probation_min_wage
    topic: 수습기간 최저임금 감액
    statement: >
      1년 이상 근로계약을 맺고 수습 중인 근로자는 수습 시작일부터 3개월 이내에 한해
      최저임금의 90%까지 감액할 수 있다. 고용노동부장관이 고시한 단순노무 업무 종사자는 제외된다.
      이 규정은 최저임금선에 대한 것이고, 그보다 높은 연봉의 수습 감액 비율 자체를 정하지 않는다.
    use_in_offer_prep: >
      수습 기간·지급률·본채용 거부 사유가 서면에 있는지 확인할 항목으로 적는다.
    legal_basis: 최저임금법 제5조 제2항, 같은 법 시행령 제3조
    status: in_force
    sources:
      - https://www.bizforms.co.kr/365guide/view.asp?number=192
    as_of: "2026-10-23"

  - id: inclusive_wage_guideline
    topic: 포괄임금·고정OT (행정 지침)
    statement: >
      고용노동부 「공짜노동 근절을 위한 포괄임금 오남용 방지 지도지침」이 2026-04-09부터 시행 중이다.
      기본급과 수당을 구분하지 않는 정액급제, 연장·야간·휴일수당을 구분하지 않는 정액수당제를
      오남용으로 보고, 고정OT 약정은 실제 근로시간에 따른 법정수당과 비교해 부족분을 지급해야 하며
      부족분은 임금체불로 다룬다.
    use_in_offer_prep: >
      오퍼에 '포괄', '고정OT', '제수당 포함'이 있으면 고정OT 시간 수, 초과분 정산 방식,
      근로시간 기록 방법을 확인할 항목으로 적는다. 지침은 법률이 아니므로 '지침에 따르면'이라고 표현한다.
    legal_basis: 고용노동부 지도지침 (행정 지침, 법률 아님)
    status: in_force
    effective: "2026-04-09"
    sources:
      - https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19208
    as_of: "2026-10-23"

  - id: inclusive_wage_ban_bill
    topic: 포괄임금 금지 법안
    statement: >
      포괄임금제를 금지하는 근로기준법 개정안이 국회에 계류 중이다. 2026-10-13 국정감사에서
      고용노동부 장관이 하반기 통과 필요성을 언급했으나, 2026-10-23 확인 기준 통과되지 않았다.
    use_in_offer_prep: 법률로 인용하지 않는다. 사용자가 물으면 '계류 중'이라고만 답한다.
    legal_basis: 근로기준법 개정안 (계류)
    status: pending
    sources:
      - https://www.mt.co.kr/economy/2026/10/13/2026101311553174749
    as_of: "2026-10-23"

  - id: non_compete
    topic: 경업금지약정
    statement: >
      경업금지를 직접 규율하는 법률 조항은 없고, 법원이 사안별로 유효성을 판단한다(판례 기준).
      대법원은 보호할 가치 있는 사용자의 이익, 퇴직 전 지위, 제한 기간·지역·대상 직종,
      대가 제공 여부, 퇴직 경위, 공공의 이익 등을 종합해 판단하며, 직업 선택의 자유를 과도하게
      제한하는 약정은 민법 제103조 위반으로 무효가 될 수 있다고 본다.
    use_in_offer_prep: >
      경업·전직금지 조항이 있으면 기간·지역·대상·대가 유무를 그대로 옮겨 적고,
      유효성은 반드시 변호사 질문 목록으로 보낸다. 같은 판단을 비유인(non-solicit) 조항에 확장하지 않는다.
    legal_basis: 대법원 2010. 3. 11. 선고 2009다82244 판결; 민법 제103조
    status: case_law
    sources:
      - https://korea.legal/wiki/2009다82244/
    as_of: "2026-10-23"

  - id: payroll_rates_2026
    topic: 4대보험 근로자 부담 요율 (scripts/kr_offer.py가 사용)
    statement: >
      국민연금 4.75%(총 9.5%, 기준소득월액 41만~659만 원, 2026-07~2027-06),
      건강보험 3.595%(총 7.19%), 장기요양 0.9448%(소득 대비, 건강보험료의 13.14%),
      고용보험 0.9%. 식대 비과세 월 20만 원.
    legal_basis: 각 공단 고시
    status: in_force
    effective: "2026-01-01 (국민연금 상·하한은 2026-07-01)"
    sources:
      - https://www.nhis.or.kr/renewal_popup/poster/20260204_poster_longdesc_1.html
      - https://www.segye.com/newsView/20260111508142
      - https://www.bizforms.co.kr/365guide/view.asp?number=309
    as_of: "2026-10-23"
