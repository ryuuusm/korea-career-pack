# korea-career-pack — 한국 근무 공고용 portals 예시 (career-ops scan용)
#
# 사용법: 이 파일의 블록을 career-ops 루트의 portals.yml에 합친다(복사 후 편집).
#         portals.yml 전체 형식과 옵션 설명은 원본 templates/portals.example.yml을 따른다.
#
# 회사 목록 원칙
# - 아래 tracked_companies는 2026-10-23에 각 회사의 공개 Greenhouse Job Board API
#   (https://boards-api.greenhouse.io/v1/boards/<slug>/jobs)를 직접 열어
#   '서울/Korea 근무 공고가 실제로 있음'을 확인한 것만 넣었다. 공고는 수시로 바뀐다.
# - careers_url은 원본 권고대로 회사 자체 채용 페이지(branded URL)로 바꾸는 것이 좋다.
#   여기서는 확인한 Greenhouse 보드 주소를 그대로 적었다.
# - 회사를 추가할 때도 같은 방식으로 직접 확인한 뒤 넣는다. 추측한 slug를 넣지 않는다.
# - 공개 Job Board API만 쓴다. 로그인이 필요한 포털(LinkedIn 등)은 scan 대상이 아니다.

# -- 한국 근무지 필터 --------------------------------------------------------
# 원본 location_filter 규칙: 빈 location은 통과(strict: true로 바꿀 수 있음),
# always_allow는 block보다 먼저 검사된다.
location_filter:
  always_allow:
    - "South Korea"
    - "Korea"
    - "Seoul"
    - "서울"
    - "대한민국"
  allow:
    - "Seoul"
    - "South Korea"
    - "Republic of Korea"
    - "Korea"
    - "Pangyo"
    - "Seongnam"
    - "판교"
    - "성남"
    - "경기"
    # - "Remote"   # 한국에서 원격 근무 가능한 공고까지 보려면 주석 해제
  block:
    - "Singapore"
    - "Tokyo"
    - "Japan"
    - "Taipei"
    - "Hong Kong"
    - "Sydney"
    - "Bengaluru"
    - "India"
    - "London"
    - "United States"

# -- 직무 키워드 (예시: IT·ERP·PM 직무. 본인 목표 직무로 바꾼다) -----------------
# 원본 title_filter 규칙을 따른다(대소문자 무시 부분일치, 2~3글자 키워드는 단어 경계).
# 한국어 공고 제목도 많으므로 한·영 키워드를 함께 넣는다.
title_filter:
  positive:
    - "Project Manager"
    - "Program Manager"
    - "IT Manager"
    - "Business Analyst"
    - "Solutions Engineer"
    - "Solutions Architect"
    - "ERP"
    - "SAP"
    - "프로젝트 매니저"
    - "PM"
    - "IT 기획"
    - "정보보안"
  negative:
    - "word:Intern"
    - "Internship"
    - "인턴"

# -- 확인된 외국계·글로벌 기업 보드 (2026-10-23 확인) ---------------------------
# 확인 당시 서울/Korea 공고 수는 참고용이다: Coupang 100건, Moloco 11건, Sendbird 4건,
# Datadog 6건(응답 일부만 확인), Databricks 2건.
tracked_companies:
  - name: Coupang
    careers_url: https://job-boards.greenhouse.io/coupang
    api: https://boards-api.greenhouse.io/v1/boards/coupang/jobs
    enabled: true

  - name: Moloco
    careers_url: https://job-boards.greenhouse.io/moloco
    api: https://boards-api.greenhouse.io/v1/boards/moloco/jobs
    enabled: true

  - name: Sendbird
    careers_url: https://job-boards.greenhouse.io/sendbird
    api: https://boards-api.greenhouse.io/v1/boards/sendbird/jobs
    enabled: true

  - name: Datadog
    careers_url: https://job-boards.greenhouse.io/datadog
    api: https://boards-api.greenhouse.io/v1/boards/datadog/jobs
    enabled: true

  - name: Databricks
    careers_url: https://job-boards.greenhouse.io/databricks
    api: https://boards-api.greenhouse.io/v1/boards/databricks/jobs
    enabled: true
